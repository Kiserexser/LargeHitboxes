plugins {
    id 'net.minecraftforge.gradle' version '6.0.26'
}

version = '1.0.0'
group = 'com.swill.lh'

minecraft {
    mappings channel: 'official', version: '1.20.4'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.4-49.1.0'
}

jar {
    manifest {
        attributes([
            "Specification-Title": "largehitboxes",
            "Specification-Vendor": "swill",
            "Implementation-Title": "LargeHitboxes",
            "Implementation-Version": project.version
        ])
    }
}
